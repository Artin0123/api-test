<!doctype html>
<html lang="zh-TW" data-theme="dark">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <title>找不到頁面 · API Key Tester</title>
        <link rel="icon" type="image/svg+xml"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4'/%3E%3C/svg%3E" />
        <script src="/boot.js"></script>
        <!-- style.css carries the theme and shell classes; style-modals.css the .btn rules. -->
        <link rel="stylesheet" href="/style.css" />
        <link rel="stylesheet" href="/style-modals.css" />
    </head>

    <body>
        <!-- Served by Cloudflare Pages with HTTP 404 for every path that is not
             a real static asset. Keep it CSP-clean: no inline script or style. -->
        <main class="workspace">
            <section class="result-group open">
                <div class="result-group-header">
                    <div class="rgh-main">
                        <div class="rgh-top">
                            <h1>404</h1>
                        </div>
                        <span class="rgh-host">找不到這個網址</span>
                    </div>
                </div>
                <div class="result-group-body">
                    <p class="muted">這個網址在站上不存在（可能是輸入錯誤，或是指向已移除的頁面）。</p>
                    <a class="btn btn-primary" href="/">回到 API Key Tester</a>
                </div>
            </section>
        </main>
    </body>

</html>
