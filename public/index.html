<!doctype html>
<html lang="zh-TW" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />
        <title>API Key Tester</title>
        <link
            rel="icon"
            type="image/svg+xml"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4'/%3E%3C/svg%3E"
        />
        <script src="/boot.js"></script>
        <link rel="stylesheet" href="/style.css" />
    </head>
    <body>
        <!-- Auth overlay -->
        <div id="auth-overlay" class="auth-overlay active">
            <section class="auth-card">
                <div>
                    <h1>API Key Tester</h1>
                    <p class="muted">输入管理密码以继续。</p>
                </div>
                <div class="auth-row">
                    <input
                        type="password"
                        id="auth-input"
                        class="input-text"
                        placeholder="ADMIN_PASSWORD"
                        autocomplete="current-password"
                    />
                    <button id="auth-btn" class="btn btn-primary" type="button">
                        登入
                    </button>
                </div>
                <p id="auth-error" class="form-error" role="alert"></p>
            </section>
        </div>

        <!-- Main app -->
        <div id="app" class="app">
            <!-- Topbar -->
            <header class="topbar">
                <div class="topbar-left">
                    <h1>API Key Tester</h1>
                </div>
                <button
                    id="mobile-menu-btn"
                    class="mobile-menu-btn"
                    type="button"
                    aria-label="Menu"
                    aria-expanded="false"
                >
                    <svg
                        viewBox="0 0 24 24"
                        width="24"
                        height="24"
                        stroke="currentColor"
                        stroke-width="2"
                        fill="none"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <div
                    id="topbar-menu-backdrop"
                    class="topbar-menu-backdrop hidden-desktop"
                ></div>
                <div id="topbar-menu" class="topbar-menu">
                    <div class="topbar-menu-header hidden-desktop">
                        <span class="topbar-menu-title">选单</span>
                        <button
                            id="mobile-menu-close"
                            class="btn-ghost btn-sm topbar-menu-close"
                            type="button"
                        >
                            关闭
                        </button>
                    </div>
                    <nav class="tabs">
                        <button
                            class="tab-btn active"
                            data-tab="config"
                            type="button"
                        >
                            来源设定
                        </button>
                        <button
                            class="tab-btn"
                            data-tab="results"
                            type="button"
                        >
                            测试结果
                        </button>
                        <button
                            class="tab-btn"
                            data-tab="deadkeys"
                            type="button"
                        >
                            失效密钥
                        </button>
                    </nav>
                    <div class="topbar-actions">
                        <a
                            id="run-now-btn"
                            class="btn btn-primary"
                            href="#"
                            target="_blank"
                            rel="noreferrer"
                            >立即执行</a
                        >
                        <button
                            id="settings-btn"
                            class="btn btn-secondary"
                            type="button"
                        >
                            设定
                        </button>
                        <button
                            id="theme-toggle"
                            class="theme-toggle"
                            type="button"
                            title="切换深浅色"
                            aria-label="切换深浅色模式"
                        >
                            🌙
                        </button>
                        <button
                            id="logout-btn"
                            class="btn btn-ghost"
                            type="button"
                        >
                            登出
                        </button>
                    </div>
                </div>
            </header>

            <main class="workspace">
                <!-- ── Config tab (default) ── -->
                <section id="tab-config" class="tab-panel active">
                    <div class="panel-head">
                        <div>
                            <h2>来源设定</h2>
                            <p class="muted">
                                管理各 API 服务商的 Keys 和 Models。
                            </p>
                        </div>
                        <div class="panel-head-actions">
                            <button
                                id="bulk-enable-btn"
                                class="btn btn-secondary"
                                type="button"
                                disabled
                            >
                                启用选中
                            </button>
                            <button
                                id="bulk-disable-btn"
                                class="btn btn-ghost"
                                type="button"
                                disabled
                            >
                                停用选中
                            </button>
                            <button
                                id="add-provider-btn"
                                class="btn btn-primary"
                                type="button"
                            >
                                新增服务商
                            </button>
                        </div>
                    </div>

                    <div id="config-loading" class="state-card">
                        读取设定中...
                    </div>
                    <div
                        id="config-error"
                        class="alert alert-error hidden"
                    ></div>

                    <div id="provider-grid" class="provider-grid hidden"></div>
                    <div id="provider-empty" class="state-card hidden">
                        尚未添加任何服务商，点击「新增服务商」开始。
                    </div>

                    <p
                        id="config-save-error"
                        class="form-error"
                        role="alert"
                    ></p>
                    <p id="config-save-ok" class="form-ok hidden" role="status">
                        设定已储存。
                    </p>
                </section>

                <!-- ── Results tab ── -->
                <section id="tab-results" class="tab-panel hidden">
                    <div class="panel-head">
                        <div>
                            <h2>测试结果</h2>
                            <p class="muted" id="results-timestamp"></p>
                        </div>
                        <button
                            id="refresh-results-btn"
                            class="btn btn-secondary"
                            type="button"
                        >
                            重新读取
                        </button>
                    </div>

                    <div id="results-loading" class="state-card">
                        读取结果中...
                    </div>
                    <div
                        id="results-error"
                        class="alert alert-error hidden"
                    ></div>
                    <div id="results-empty" class="state-card hidden">
                        尚无测试结果，请先执行一次测试。
                    </div>
                    <div id="results-body" class="hidden"></div>
                </section>

                <!-- ── Dead keys tab ── -->
                <section id="tab-deadkeys" class="tab-panel hidden">
                    <div class="panel-head">
                        <div>
                            <h2>失效密钥</h2>
                            <p class="muted">
                                手动记录已失效的 Key、失效时间与供应商回传的错误讯息。
                            </p>
                        </div>
                        <div class="panel-head-actions">
                            <button
                                id="dk-refresh-btn"
                                class="btn btn-secondary"
                                type="button"
                            >
                                重新读取
                            </button>
                            <button
                                id="dk-bulk-del-btn"
                                class="btn btn-danger-solid"
                                type="button"
                                aria-pressed="false"
                            >
                                删除密钥
                            </button>
                        </div>
                    </div>

                    <div class="dk-toolbar">
                        <div class="dk-add-row">
                            <select
                                id="dk-host"
                                class="input-select"
                                aria-label="域名供应商"
                            ></select>
                            <input
                                type="text"
                                id="dk-key"
                                class="input-text"
                                placeholder="API Key"
                                autocomplete="off"
                                spellcheck="false"
                            />
                            <input
                                type="date"
                                id="dk-expired"
                                class="input-text"
                                aria-label="失效时间"
                            />
                            <button
                                id="dk-add-btn"
                                class="btn btn-primary"
                                type="button"
                            >
                                新增
                            </button>
                        </div>
                        <div class="dk-toolbar-actions">
                            <button
                                id="dk-filter-toggle"
                                class="btn btn-ghost btn-sm dk-filter-btn"
                                type="button"
                                aria-expanded="false"
                            >
                                <svg
                                    viewBox="0 0 24 24"
                                    width="14"
                                    height="14"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    fill="none"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >
                                    <polygon
                                        points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"
                                    ></polygon>
                                </svg>
                                筛选
                                <span
                                    id="dk-filter-count"
                                    class="badge hidden"
                                ></span>
                            </button>
                        </div>
                    </div>

                    <p id="dk-form-error" class="form-error" role="alert"></p>

                    <div id="dk-filter-panel" class="dk-filter-panel hidden">
                        <label class="field">
                            <span class="field-label">供应商域名</span>
                            <select id="dk-f-host" class="input-select"></select>
                        </label>
                        <label class="field">
                            <span class="field-label">Key 搜寻</span>
                            <input
                                type="text"
                                id="dk-f-key"
                                class="input-text"
                                placeholder="模糊匹配"
                                autocomplete="off"
                            />
                        </label>
                        <label class="field">
                            <span class="field-label">失效时间（起）</span>
                            <input
                                type="date"
                                id="dk-f-from"
                                class="input-text"
                            />
                        </label>
                        <label class="field">
                            <span class="field-label">失效时间（迄）</span>
                            <input type="date" id="dk-f-to" class="input-text" />
                        </label>
                        <button
                            id="dk-f-reset"
                            class="btn btn-ghost btn-sm"
                            type="button"
                        >
                            清除筛选
                        </button>
                    </div>

                    <div id="dk-loading" class="state-card">读取中...</div>
                    <div id="dk-error" class="alert alert-error hidden"></div>
                    <div id="dk-empty" class="state-card hidden">
                        尚无失效密钥记录。
                    </div>
                    <div id="dk-table-wrap" class="hidden"></div>
                </section>
            </main>
        </div>

        <!-- Provider editor modal -->
        <div id="editor-overlay" class="modal-overlay hidden">
            <div class="modal-backdrop" data-close-modal="editor"></div>
            <section
                class="modal-panel"
                role="dialog"
                aria-modal="true"
                aria-labelledby="editor-title"
            >
                <div class="modal-header">
                    <div>
                        <h3 id="editor-title">新增服务商</h3>
                    </div>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editor-index" value="-1" />

                    <label class="field">
                        <span class="field-label">
                            Provider Type
                            <span class="info-icon" tabindex="0">
                                <svg
                                    viewBox="0 0 24 24"
                                    width="14"
                                    height="14"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    fill="none"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <line
                                        x1="12"
                                        y1="16"
                                        x2="12"
                                        y2="12"
                                    ></line>
                                    <line
                                        x1="12"
                                        y1="8"
                                        x2="12.01"
                                        y2="8"
                                    ></line>
                                </svg>
                                <span class="info-tooltip"
                                    >系统会自动补全以下后缀：<br />OpenAI:
                                    <code>/chat/completions</code><br />Gemini:
                                    <code
                                        >/models/{model}:streamGenerateContent</code
                                    ><br />Ollama: <code>/api/chat</code
                                    ><br />Anthropic:
                                    <code>/messages</code></span
                                >
                            </span>
                        </span>
                        <select id="ed-provider-type" class="input-select">
                            <option value="openai">openai</option>
                            <option value="ollama">ollama</option>
                            <option value="gemini">gemini</option>
                            <option value="anthropic">anthropic</option>
                        </select>
                    </label>

                    <label class="field">
                        <span class="field-label">API Base URL</span>
                        <input
                            type="url"
                            id="ed-api-base"
                            class="input-text"
                            placeholder="https://api.openai.com/v1"
                        />
                    </label>

                    <label class="field">
                        <span class="field-label"
                            >API Keys
                            <small class="muted">一行一个</small></span
                        >
                        <div class="lined-editor modal-editor-box">
                            <div class="line-nums" aria-hidden="true"></div>
                            <textarea
                                id="ed-keys"
                                class="input-textarea lined-textarea"
                                spellcheck="false"
                                placeholder="sk-xxxxxxxxxxxxxxxx&#10;sk-yyyyyyyyyyyyyyyy"
                            ></textarea>
                        </div>
                    </label>

                    <label class="field">
                        <span class="field-label"
                            >Models
                            <small class="muted">逗号分隔（一行）</small></span
                        >
                        <div
                            class="lined-editor lined-editor--wrap modal-editor-box"
                        >
                            <div class="line-nums" aria-hidden="true"></div>
                            <textarea
                                id="ed-models"
                                class="input-textarea lined-textarea"
                                spellcheck="false"
                                placeholder="gpt-4o,gpt-4.1,gpt-4.1-mini"
                            ></textarea>
                        </div>
                    </label>

                    <label class="field">
                        <span class="field-label">
                            Extra Body
                            <small class="muted"
                                >选填，JSON，键直接覆盖请求体同名键</small
                            >
                            <span
                                id="ed-extra-body-status"
                                class="json-status"
                                aria-live="polite"
                            ></span>
                        </span>
                        <div
                            class="lined-editor lined-editor--wrap modal-editor-box modal-editor-box--sm"
                        >
                            <div class="line-nums" aria-hidden="true"></div>
                            <textarea
                                id="ed-extra-body"
                                class="input-textarea lined-textarea"
                                spellcheck="false"
                                placeholder='{"temperature": 0.7, "enable_thinking": true}'
                            ></textarea>
                        </div>
                    </label>

                    <label class="field">
                        <span class="field-label">
                            Max Concurrency
                            <small class="muted"
                                >选填，正整数，覆盖全局预设值（脚本默认:
                                2）</small
                            >
                        </span>
                        <input
                            type="number"
                            id="ed-max-concurrency"
                            class="input-text input-concurrency"
                            placeholder="2"
                            min="1"
                            max="200"
                        />
                    </label>

                    <p id="editor-error" class="form-error" role="alert"></p>
                </div>
                <div class="modal-footer">
                    <button
                        class="btn btn-primary"
                        id="editor-save-btn"
                        type="button"
                    >
                        储存
                    </button>
                    <button
                        class="btn btn-ghost"
                        id="editor-cancel-btn"
                        type="button"
                    >
                        取消
                    </button>
                </div>
            </section>
        </div>

        <!-- App settings modal -->
        <div id="settings-overlay" class="modal-overlay hidden">
            <div class="modal-backdrop" data-close-modal="settings"></div>
            <section
                class="modal-panel"
                role="dialog"
                aria-modal="true"
                aria-labelledby="settings-title"
            >
                <div class="modal-header">
                    <h3 id="settings-title">应用设定</h3>
                </div>
                <div class="modal-body">
                    <label class="field">
                        <span class="field-label">GitHub Actions URL</span>
                        <input
                            type="url"
                            id="set-github-url"
                            class="input-text"
                            placeholder="https://github.com/owner/repo/actions/workflows/main.yml"
                        />
                    </label>
                    <label class="field">
                        <span class="field-label">Discord Webhook URL</span>
                        <div class="field-row">
                            <input
                                type="url"
                                id="set-discord-url"
                                class="input-text"
                                placeholder="https://discord.com/api/webhooks/..."
                            />
                            <button
                                id="test-discord-btn"
                                class="btn btn-secondary no-shrink"
                                type="button"
                            >
                                测试
                            </button>
                        </div>
                    </label>
                    <p id="settings-error" class="form-error" role="alert"></p>
                    <p id="settings-ok" class="form-ok hidden" role="status">
                        设定已储存。
                    </p>
                </div>
                <div class="modal-footer">
                    <button
                        class="btn btn-primary"
                        id="settings-save-btn"
                        type="button"
                    >
                        储存
                    </button>
                    <button
                        class="btn btn-ghost"
                        id="settings-cancel-btn"
                        type="button"
                    >
                        取消
                    </button>
                </div>
            </section>
        </div>

        <!-- Sample modal -->
        <div id="sample-overlay" class="modal-overlay hidden">
            <div class="modal-backdrop" data-close-modal="sample"></div>
            <section
                class="modal-panel modal-panel--wide"
                role="dialog"
                aria-modal="true"
                aria-labelledby="sample-title"
            >
                <div class="modal-header">
                    <div>
                        <h3 id="sample-title">Sample</h3>
                        <p id="sample-subtitle" class="muted"></p>
                    </div>
                    <button
                        class="btn btn-ghost btn-sm"
                        id="sample-close-btn"
                        type="button"
                    >
                        关闭
                    </button>
                </div>
                <div class="modal-body" id="sample-content"></div>
            </section>
        </div>

        <!-- Dead key editor modal -->
        <div id="dkedit-overlay" class="modal-overlay hidden">
            <div class="modal-backdrop" data-close-modal="dkedit"></div>
            <section
                class="modal-panel"
                role="dialog"
                aria-modal="true"
                aria-labelledby="dkedit-title"
            >
                <div class="modal-header">
                    <h3 id="dkedit-title">编辑失效密钥</h3>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="dkedit-id" value="" />
                    <label class="field">
                        <span class="field-label">域名供应商</span>
                        <select id="dke-host" class="input-select"></select>
                    </label>
                    <label class="field">
                        <span class="field-label">API Key</span>
                        <input
                            type="text"
                            id="dke-key"
                            class="input-text"
                            autocomplete="off"
                            spellcheck="false"
                        />
                    </label>
                    <label class="field">
                        <span class="field-label">失效时间</span>
                        <input type="date" id="dke-expired" class="input-text" />
                    </label>
                    <label class="field">
                        <span class="field-label">
                            Error Code
                            <small class="muted">选填，HTTP 状态码</small>
                        </span>
                        <input
                            type="number"
                            id="dke-code"
                            class="input-text input-errcode"
                            placeholder="401"
                        />
                    </label>
                    <p id="dkedit-error" class="form-error" role="alert"></p>
                </div>
                <div class="modal-footer">
                    <button
                        class="btn btn-primary"
                        id="dkedit-save-btn"
                        type="button"
                    >
                        储存
                    </button>
                    <button
                        class="btn btn-ghost"
                        id="dkedit-cancel-btn"
                        type="button"
                    >
                        取消
                    </button>
                </div>
            </section>
        </div>

        <!-- Dead key bulk-delete confirm -->
        <div id="dkconfirm-overlay" class="modal-overlay hidden">
            <div class="modal-backdrop" data-close-modal="dkconfirm"></div>
            <section
                class="modal-panel"
                role="dialog"
                aria-modal="true"
                aria-labelledby="dkconfirm-title"
            >
                <div class="modal-header">
                    <h3 id="dkconfirm-title">确认删除</h3>
                </div>
                <div class="modal-body">
                    <p id="dkconfirm-msg" class="dk-confirm-msg"></p>
                    <ul id="dkconfirm-list" class="dk-confirm-list"></ul>
                    <p id="dkconfirm-error" class="form-error" role="alert"></p>
                </div>
                <div class="modal-footer">
                    <button
                        class="btn btn-danger-solid"
                        id="dkconfirm-ok-btn"
                        type="button"
                    >
                        确认删除
                    </button>
                    <button
                        class="btn btn-ghost"
                        id="dkconfirm-cancel-btn"
                        type="button"
                    >
                        取消
                    </button>
                </div>
            </section>
        </div>

        <!-- Error detail modal (shared: results tab + dead keys tab) -->
        <div id="errdetail-overlay" class="modal-overlay hidden">
            <div class="modal-backdrop" data-close-modal="errdetail"></div>
            <section
                class="modal-panel modal-panel--wide"
                role="dialog"
                aria-modal="true"
                aria-labelledby="errdetail-title"
            >
                <div class="modal-header">
                    <div>
                        <h3 id="errdetail-title">错误详情</h3>
                        <p id="errdetail-subtitle" class="muted"></p>
                    </div>
                    <button
                        class="btn btn-ghost btn-sm"
                        id="errdetail-close-btn"
                        type="button"
                    >
                        关闭
                    </button>
                </div>
                <div class="modal-body" id="errdetail-content"></div>
            </section>
        </div>

        <script src="/app.js"></script>
    </body>
</html>
